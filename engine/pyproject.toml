[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agla-engine"
version = "1.0.0"
description = "Scores Pulse recordings: reading fluency against the passage shown, and spoken English."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.28",
  "numpy>=2.0",
]

[project.optional-dependencies]
# Speech recognition. Install PyTorch from its CPU index first on machines without a GPU.
speech = [
  "av>=14",
  "faster-whisper>=1.1",
  "huggingface_hub>=0.30",
  "onnxruntime>=1.20",
  "torch>=2.6",
]
test = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
agla-engine = "agla_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
