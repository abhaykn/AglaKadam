name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  engine:
    name: Scoring engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            engine/constraints.txt

      # The tests need no speech model: they cover everything around the recognisers. The audio
      # decoder and the model download library are installed for the tests that use them.
      - name: Install the engine
        run: |
          python -m pip install --constraint engine/constraints.txt "./engine[test]" av huggingface_hub

      - name: Lint
        run: python -m ruff check engine && python -m ruff format --check engine

      - name: Unit tests
        run: python -m pytest engine/tests -q
